<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.json"><title>VIP TRANSFER</title><style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#f7f7f7;font:16px system-ui,Arial}header{padding:22px 16px;border-bottom:1px solid #333;background:#080808;position:sticky;top:0}.brand{font-size:24px;font-weight:800;letter-spacing:2px;color:#d6b15c}main{max-width:820px;margin:auto;padding:14px}.card{background:#151515;border:1px solid #333;border-radius:15px;padding:15px;margin:13px 0}h2{font-size:19px;margin:0 0 12px}label{display:block;font-size:13px;color:#ddd;margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #444;background:#080808;color:white;font:inherit}button{border:1px solid #6b582c;background:#211b0c;color:#f5d987;border-radius:9px;padding:11px;font-weight:700;cursor:pointer}.primary{background:#d6b15c;color:#17120a;border:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}.notice{padding:10px;background:#292315;border-radius:8px;margin-top:10px}.muted{color:#aaa;font-size:13px}.offer{border-top:1px solid #333;padding:12px 0;display:flex;justify-content:space-between;gap:10px}.price{font-size:20px;color:#d6b15c;font-weight:800}footer{text-align:center;color:#888;padding:25px;font-size:12px}@media(max-width:520px){.row{grid-template-columns:1fr}.brand{font-size:21px}}</style></head><body><header><div class="brand">VIP TRANSFER</div><div class="muted">Comfort · Business · VIP</div></header><main>
<div class="card"><h2>Account</h2><label>Name (registration)</label><input id="name" placeholder="Full name"><label>Email</label><input id="email" type="email" placeholder="you@example.com"><label>Password</label><input id="password" type="password" placeholder="10+ characters"><label>Account type</label><select id="role"><option value="customer">Customer</option><option value="driver">Driver</option></select><div class="row" style="margin-top:10px"><button class="primary" onclick="register()">Create account</button><button onclick="login()">Sign in</button></div><button style="margin-top:8px;width:100%" onclick="logout()">Sign out</button><div id="authMsg" class="notice hidden"></div></div>
<div id="app" class="hidden"><div id="whoami" class="muted" style="padding:4px 2px"></div><div class="card tabs"><button id="tabBook" onclick="tab('book')">Customer booking</button><button id="tabDriver" onclick="tab('driver')">Driver offer/vehicle</button><button id="tabMine" onclick="tab('mine')">Bookings & chat</button><button id="tabAdmin" onclick="tab('admin')">Admin settings</button></div>
<section id="book" class="card"><h2>Book a transfer</h2><label>Pickup</label><input id="pickup"><label>Destination</label><input id="destination"><label>Category</label><select id="category"><option>Comfort</option><option>Business</option><option>VIP</option></select><label>Pickup date/time (optional)</label><input id="pickupAt" type="datetime-local"><label>Notes</label><textarea id="notes"></textarea><button class="primary" style="width:100%;margin-top:10px" onclick="booking()">Submit booking</button><div id="bookMsg" class="notice hidden"></div></section>
<section id="driver" class="card hidden"><h2>Driver offer</h2><label>Booking ID</label><input id="bookingId" type="number"><label>Price (SAR)</label><input id="price" type="number"><label>Approved vehicle ID (optional)</label><input id="vehicleId" type="number"><button class="primary" style="width:100%;margin-top:10px" onclick="offer()">Send offer</button><h2 style="margin-top:20px">Submit vehicle for approval</h2><label>Category</label><select id="vcat"><option>Comfort</option><option>Business</option><option>VIP</option></select><label>Model</label><input id="model" placeholder="Mercedes-Benz V-Class"><label>Model year (optional)</label><input id="year" type="number"><label>Photo URL (optional)</label><input id="photo"><button style="width:100%;margin-top:10px" onclick="vehicle()">Submit vehicle</button><div id="driverMsg" class="notice hidden"></div></section>
<section id="mine" class="card hidden"><h2>Bookings</h2><button onclick="loadBookings()">Refresh</button><div id="bookingList"></div><label>Booking ID to view offers</label><input id="offersBooking" type="number"><button onclick="loadOffers()">Show offers</button><div id="offerList"></div><label>Offer ID to accept</label><input id="acceptId" type="number"><button class="primary" onclick="accept()">Accept offer</button><label>Accepted ride booking ID for chat</label><input id="chatId" type="number"><button onclick="loadChat()">Load chat</button><div id="messages"></div><label>Message</label><textarea id="body"></textarea><button style="margin-top:8px" onclick="sendChat()">Send message</button><div id="mineMsg" class="notice hidden"></div></section>
<section id="admin" class="card hidden"><h2>Admin pricing and offers</h2><label>Pricing mode</label><select id="mode"><option value="driver_offers">Driver offers</option><option value="admin_fixed">Admin fixed prices</option><option value="both">Fixed prices + driver offers</option></select><div class="row"><div><label>Comfort SAR</label><input id="comfort" type="number" value="200"></div><div><label>Business SAR</label><input id="business" type="number" value="350"></div></div><label>VIP SAR</label><input id="vip" type="number" value="500"><label>Driver offers</label><select id="enabled"><option value="true">On</option><option value="false">Off</option></select><label>Show model year</label><select id="showYear"><option value="false">Hide</option><option value="true">Show</option></select><button class="primary" style="width:100%;margin-top:10px" onclick="saveSettings()">Save settings</button><button style="width:100%;margin-top:8px" onclick="drivers()">Driver approvals</button><button style="width:100%;margin-top:8px" onclick="vehicles()">Vehicle approvals</button><div id="adminMsg" class="notice hidden"></div><div id="driverList"></div></section></div></main><footer>VIP TRANSFER · Support: support@limuzin.vip.si<br>Production hosting and testing required.</footer>
<script>
let token=localStorage.getItem('vipToken')||'';const $=x=>document.getElementById(x);const msg=(id,s)=>{$(id).textContent=s;$(id).classList.remove('hidden')};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,m='GET',b){let r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(b?{body:JSON.stringify(b)}:{})});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function show(){
  $('app').classList.toggle('hidden',!token);
  if(!token){$('whoami').textContent='';return}
  try {
    const d=await api('/me'); const u=d.user;
    $('whoami').textContent='Signed in: '+u.name+' · '+u.role+(u.role==='driver'&&!u.approved?' · Approval pending':'');
    $('tabBook').classList.toggle('hidden',u.role!=='customer');
    $('tabDriver').classList.toggle('hidden',u.role!=='driver');
    $('tabMine').classList.toggle('hidden',false);
    $('tabAdmin').classList.toggle('hidden',u.role!=='admin');
    if(u.role==='customer') tab('book'); else if(u.role==='driver') tab('driver'); else tab('admin');
  } catch(e) { token='';localStorage.removeItem('vipToken');$('app').classList.add('hidden');msg('authMsg','Session expired. Please sign in again.'); }
}
function logout(){token='';localStorage.removeItem('vipToken');show();msg('authMsg','Signed out.')}
async function register(){try{let d=await api('/auth/register','POST',{name:$('name').value,email:$('email').value,password:$('password').value,role:$('role').value});token=d.token;localStorage.setItem('vipToken',token);show();msg('authMsg',d.message)}catch(e){msg('authMsg',e.message)}}
async function login(){try{let d=await api('/auth/login','POST',{email:$('email').value,password:$('password').value});token=d.token;localStorage.setItem('vipToken',token);show();msg('authMsg','Signed in successfully.')}catch(e){msg('authMsg',e.message)}}
function tab(t){['book','driver','mine','admin'].forEach(x=>$(x).classList.toggle('hidden',x!==t));if(t==='mine')loadBookings();if(t==='admin')loadSettings()}
async function booking(){try{let d=await api('/bookings','POST',{pickup:$('pickup').value,destination:$('destination').value,category:$('category').value,notes:$('notes').value,pickup_at:$('pickupAt').value?new Date($('pickupAt').value).toISOString():null});$('offersBooking').value=d.booking.id;msg('bookMsg','Booking created. ID: '+d.booking.id+'. Drivers can now send offers.')}catch(e){msg('bookMsg',e.message)}}
async function offer(){try{let d=await api('/bookings/'+Number($('bookingId').value)+'/offers','POST',{price_sar:Number($('price').value),vehicle_id:$('vehicleId').value?Number($('vehicleId').value):null});msg('driverMsg','Offer sent. ID: '+d.offer.id)}catch(e){msg('driverMsg',e.message)}}
async function vehicle(){try{let d=await api('/vehicles','POST',{category:$('vcat').value,model:$('model').value,model_year:$('year').value?Number($('year').value):null,photo_url:$('photo').value});msg('driverMsg','Vehicle sent for admin approval. ID: '+d.vehicle.id)}catch(e){msg('driverMsg',e.message)}}
async function loadBookings(){try{let d=await api('/bookings');$('bookingList').innerHTML=d.bookings.map(b=>`<div class="offer"><div><b>#${b.id} ${esc(b.pickup)} → ${esc(b.destination)}</b><div>${esc(b.category)} · ${esc(b.status)}</div></div><button onclick="$('offersBooking').value=${b.id};loadOffers()">Offers</button></div>`).join('')||'<p class="muted">No bookings.</p>'}catch(e){msg('mineMsg',e.message)}}
async function loadOffers(){try{let d=await api('/bookings/'+Number($('offersBooking').value)+'/offers');$('offerList').innerHTML=d.offers.map(o=>`<div class="offer"><div><b>Offer #${o.id}</b><div>${esc(o.model||o.category||'Vehicle')} · Driver contact hidden</div>${o.model_year?`<div class="muted">Model year: ${esc(o.model_year)}</div>`:''}${o.photo_url?`<div><img src="${esc(o.photo_url)}" alt="Vehicle" style="max-width:150px;max-height:90px;border-radius:8px;margin-top:6px" loading="lazy"></div>`:''}<button style="margin-top:8px" onclick="$('acceptId').value=${o.id}">Select this offer</button></div><div class="price">SAR ${o.price_sar}</div></div>`).join('')||'<p>No offers yet.</p>'}catch(e){msg('mineMsg',e.message)}}
async function accept(){try{let d=await api('/bookings/'+Number($('offersBooking').value)+'/accept/'+Number($('acceptId').value),'POST',{});$('chatId').value=$('offersBooking').value;msg('mineMsg',d.message)}catch(e){msg('mineMsg',e.message)}}
async function loadChat(){try{let d=await api('/bookings/'+Number($('chatId').value)+'/messages');$('messages').innerHTML=d.messages.map(m=>`<div class="offer"><div><b>${esc(m.sender_name)}</b><p>${esc(m.body)}</p></div></div>`).join('')||'<p>No messages.</p>'}catch(e){msg('mineMsg',e.message)}}
async function sendChat(){try{await api('/bookings/'+Number($('chatId').value)+'/messages','POST',{body:$('body').value});$('body').value='';await loadChat()}catch(e){msg('mineMsg',e.message)}}
async function loadSettings(){try{let s=(await api('/admin/settings')).settings;$('mode').value=s.pricing_mode;$('comfort').value=s.comfort_price;$('business').value=s.business_price;$('vip').value=s.vip_price;$('enabled').value=String(s.offers_enabled);$('showYear').value=String(s.show_model_year)}catch(e){msg('adminMsg',e.message)}}
async function saveSettings(){try{await api('/admin/settings','PATCH',{pricing_mode:$('mode').value,comfort_price:Number($('comfort').value),business_price:Number($('business').value),vip_price:Number($('vip').value),offers_enabled:$('enabled').value==='true',show_model_year:$('showYear').value==='true'});msg('adminMsg','Settings saved.')}catch(e){msg('adminMsg',e.message)}}
async function drivers(){try{let d=await api('/admin/drivers');$('driverList').innerHTML=d.drivers.map(x=>`<div class="offer"><div>${esc(x.name)}<div class="muted">${esc(x.email)} · ${x.approved?'Approved':'Pending'}</div></div><button onclick="approve(${x.id},${!x.approved})">${x.approved?'Revoke':'Approve'}</button></div>`).join('')}catch(e){msg('adminMsg',e.message)}}
async function approve(id,approved){try{await api('/admin/drivers/'+id+'/approval','PATCH',{approved});drivers()}catch(e){msg('adminMsg',e.message)}}
async function vehicles(){try{let d=await api('/admin/vehicles');$('driverList').innerHTML=d.vehicles.map(v=>`<div class="offer"><div><b>${esc(v.model)} · ${esc(v.category)}</b><div class="muted">Driver: ${esc(v.driver_name)} · ${v.approved?'Approved':'Pending'}</div></div><button onclick="approveVehicle(${v.id},${!v.approved})">${v.approved?'Revoke':'Approve'}</button></div>`).join('')||'<p>No vehicles submitted.</p>'}catch(e){msg('adminMsg',e.message)}}
async function approveVehicle(id,approved){try{await api('/admin/vehicles/'+id+'/approval','PATCH',{approved});vehicles()}catch(e){msg('adminMsg',e.message)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});show();
</script></body></html>
